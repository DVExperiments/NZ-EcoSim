<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NZ EcoSim</title>
<style>
  :root { --bg: #14161a; --panel: #1e2127; --text: #dee0e6; --dim: #8c929e; --accent: #7ece92; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; max-width: 100vw; max-height: 100vh;
           width: min(100vw, calc(100vh * 1300 / 780)); height: auto; aspect-ratio: 1300 / 780; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 14px; background: var(--bg); z-index: 2; padding: 16px; text-align: center; }
  #loading h1 { margin: 0; font-size: 28px; }
  #bar { width: min(420px, 90vw); height: 8px; background: #2c3038; border-radius: 4px; overflow: hidden; }
  #bar div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #msg { color: var(--dim); font-size: 14px; }
  #err { color: #f08070; white-space: pre-wrap; font-family: monospace; font-size: 12px; max-width: 900px; }
  #pop { position: fixed; top: 6px; left: 8px; z-index: 3; font-size: 12px; color: #dee0e6; background: rgba(20,22,26,.75);
         padding: 4px 9px; border-radius: 6px; text-decoration: none; border: 1px solid #333a45; }
  #note { color: var(--dim); font-size: 13px; max-width: 520px; line-height: 1.45; }
</style>
</head>
<body>
<div id="loading">
  <h1>NZ EcoSim</h1>
  <div id="bar"><div></div></div>
  <div id="msg">Starting...</div>
  <div id="note">Everything runs inside your browser. The first visit downloads about 20 MB; after that it
    loads faster. Your island is saved in this browser. Click the simulation before using the keyboard.</div>
  <div id="err"></div>
</div>
<a id="pop" hidden href="./" target="_blank" rel="noopener" title="Open in a new tab">Open full screen &#8599;</a>
<div id="stage"><canvas id="canvas" width="1300" height="780" tabindex="1"></canvas></div>
<script>
const msg = t => document.getElementById("msg").textContent = t;
const bar = p => document.querySelector("#bar div").style.width = p + "%";
const canvas = document.getElementById("canvas");
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("mousedown", () => canvas.focus());
// stop the page scrolling while using the mouse wheel / arrow keys over the simulation
canvas.addEventListener("wheel", e => e.preventDefault(), { passive: false });
window.addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Tab"].includes(e.key) &&
      document.activeElement === canvas) e.preventDefault();
});

// Python runs in the browser (Pyodide). It is loaded from a free CDN; if a "pyodide" folder is
// uploaded next to this page it is used instead.
const PYODIDE_SOURCES = ["https://cdn.jsdelivr.net/pyodide/v0.27.7/full/", "./pyodide/"];
const APP_FILES = ["nz_ecosim.py", "world.py", "humans.py", "species_nz.py", "alerts.py", "views.py", "ui_kit.py", "config.py", "foodweb.py", "scenarios.py", "lessons_ui.py", "report.py", "webplatform.py"];

function loadScript(url) {
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = url; s.onload = ok; s.onerror = () => fail(new Error("could not load " + url));
    document.head.appendChild(s);
  });
}

async function main() {
  try {
    msg("Loading Python (WebAssembly)..."); bar(10);
    let py = null, lastErr = null;
    for (const base of PYODIDE_SOURCES) {
      try {
        await loadScript(base + "pyodide.js");
        py = await loadPyodide({ indexURL: base });
        break;
      } catch (e) { lastErr = e; }
    }
    if (!py) throw lastErr || new Error("Python could not be loaded");
    window.nzPy = py;   // handy for debugging in the browser console
    msg("Loading numpy and pygame..."); bar(45);
    await py.loadPackage(["numpy", "pygame-ce"]);
    msg("Loading NZ EcoSim..."); bar(75);
    py.FS.mkdirTree("/home/pyodide/app");
    for (const f of APP_FILES) {
      const r = await fetch(f, { cache: "no-cache" });
      if (!r.ok) throw new Error("Missing file: " + f + " (upload it next to index.html)");
      py.FS.writeFile("/home/pyodide/app/" + f, new Uint8Array(await r.arrayBuffer()));
    }
    bar(100);
    py.canvas.setCanvas2D(canvas);
    document.getElementById("loading").style.display = "none";
    if (window.self !== window.top) document.getElementById("pop").hidden = false;
    canvas.focus();
    await py.runPythonAsync(`
import os, sys
sys.path.insert(0, "/home/pyodide/app")
os.chdir("/home/pyodide")
import nz_ecosim
app = nz_ecosim.App()
await app.run_async()
`);
  } catch (e) {
    document.getElementById("loading").style.display = "flex";
    msg("Something went wrong starting NZ EcoSim.");
    document.getElementById("err").textContent = String(e);
    console.error(e);
  }
}
main();
</script>
</body>
</html>
